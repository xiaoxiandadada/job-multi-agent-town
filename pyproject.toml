[project]
name = "job-agent-studio"
version = "0.1.0"
description = "A provider-neutral multi-agent harness for AI job search, exposed through Feishu."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "langgraph>=0.3",
  "lark-oapi>=1.4",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[project.scripts]
job-agent-api = "job_agent_harness.api:main"
job-agent-feishu = "job_agent_harness.feishu_channel:main"
job-agent-push-daily = "job_agent_harness.push_daily:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_agent_harness"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
